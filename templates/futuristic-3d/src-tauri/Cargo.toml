[package]
name = "tauri-custom-installer-template-futuristic-3d"
version = "0.2.0"
description = "Futuristic 3D Cyberpunk custom installer built with Tauri v2, React, and Three.js"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", features = ["wry", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-custom-installer-core = { path = "../../../packages/core" }
