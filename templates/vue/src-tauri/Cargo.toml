[package]
name = "tauri-custom-installer-template-vue"
version = "0.1.0"
description = "Vue 3 custom installer for Tauri v2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", features = ["wry", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-custom-installer-core = { path = "../../../packages/core" }
