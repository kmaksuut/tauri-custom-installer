[package]
name = "tauri-custom-installer-template-react"
version = "0.1.0"
description = "Custom installer launcher built with Tauri v2 and React"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-custom-installer-core = { path = "../../../packages/core" }
