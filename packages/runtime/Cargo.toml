[package]
name = "tci-runtime"
version = "0.2.0"
description = "Prebuilt self-extracting runtime stub for Tauri Custom Installer"
edition = "2021"
license = "MIT"

[[bin]]
name = "tci-runtime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-custom-installer-core = { path = "../core" }
