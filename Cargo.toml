[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/runtime",
    "templates/react/src-tauri",
    "templates/futuristic-3d/src-tauri",
    "templates/vanilla/src-tauri",
    "templates/svelte/src-tauri",
    "templates/vue/src-tauri",
    "examples/sample-tauri-app/src-tauri",
    "examples/sample-tauri-app/installer/src-tauri",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
